<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ALIP MAJUMDAR - VLSI and CORDIC hardware</title>
  <desc id="desc">An animated circuit-style banner using the GitHub profile avatar of ALIP MAJUMDAR, with rotating signal rings and the labels VLSI and CORDIC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172536"/>
      <stop offset="1" stop-color="#334d68"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b07b"/>
      <stop offset="1" stop-color="#be6d47"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="avatarClip"><circle cx="600" cy="180" r="88"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9db5c9" stroke-opacity=".09"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <g fill="none" stroke="url(#copper)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M48 88H230L270 128"/>
    <path d="M48 272H220L270 222"/>
    <path d="M930 128L970 88H1152"/>
    <path d="M930 222L980 272H1152"/>
    <path d="M260 180H370"/>
    <path d="M830 180H940"/>
  </g>

  <g fill="#f2b07b">
    <circle cx="48" cy="88" r="5"/><circle cx="48" cy="272" r="5"/>
    <circle cx="1152" cy="88" r="5"/><circle cx="1152" cy="272" r="5"/>
    <circle cx="370" cy="180" r="5"/><circle cx="830" cy="180" r="5"/>
  </g>

  <g transform="translate(600 180)" fill="none" stroke="#f2b07b" stroke-width="2" opacity=".85">
    <ellipse rx="190" ry="108" stroke-dasharray="8 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="220" ry="72" stroke-dasharray="3 16" opacity=".7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <circle cx="600" cy="180" r="96" fill="#172536" stroke="#f2b07b" stroke-width="3"/>
  <image x="512" y="92" width="176" height="176" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" href="motherboard77-avatar.png" xlink:href="motherboard77-avatar.png"/>
  <circle cx="600" cy="180" r="91" fill="none" stroke="#fff4e8" stroke-opacity=".72" stroke-width="2"/>

  <g font-family="monospace" fill="#fff4e8" text-anchor="middle">
    <text x="600" y="34" font-size="15" letter-spacing="5">ALIP MAJUMDAR</text>
    <text x="600" y="343" font-size="14" letter-spacing="4" fill="#f2b07b">VLSI  /  CORDIC  /  HARDWARE DESIGN</text>
  </g>

  <g font-family="monospace" font-size="12" fill="#dbe9f4">
    <text x="48" y="72">INPUT</text>
    <text x="1058" y="72">OUTPUT</text>
    <text x="48" y="307">Q FORMAT</text>
    <text x="1052" y="307">PIPELINE</text>
  </g>
</svg>
